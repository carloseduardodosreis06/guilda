<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildControl - Painel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; background-color: #0b111e; color: #ffffff; min-height: 100vh; }
        .sidebar { width: 280px; background-color: #111a2e; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #1f2d4a; }
        .sidebar h2 { font-size: 22px; color: #a855f7; margin-bottom: 25px; text-align: center; font-weight: bold; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 15px; border-radius: 6px; font-weight: 500; transition: 0.3s; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #a855f7; color: #ffffff; font-weight: bold; }
        .sidebar .logout { margin-top: auto; background-color: #ea580c; color: white; text-align: center; }
        .main-content { flex: 1; padding: 40px; background-color: #0d0f1d; }
        .header { margin-bottom: 30px; border-bottom: 1px solid #1f2d4a; padding-bottom: 15px; }
        .header h1 { font-size: 28px; }
        .header span { color: #a855f7; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background-color: #182235; padding: 30px; border-radius: 10px; border: 1px solid #26354e; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { font-size: 15px; color: #64748b; margin-bottom: 12px; text-transform: uppercase; }
        .card p { font-size: 36px; font-weight: bold; color: #a855f7; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚔️ GuildControl</h2>
        <a href="/dashboard" class="active">Início / Painel da Guilda</a>
        <a href="/membros">Gerenciar Membros</a>
        <a href="/planos">Planos da Guilda</a>
        <a href="/pontuacoes">Pontuação</a>
        <a href="/servicos">Serviços</a>
        <a href="/auth/logout" class="logout">Sair da Conta</a>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Painel da Guilda - <span>Início</span></h1>
        </div>
        <div class="cards-grid">
            <div class="card">
                <h3>Total de Membros</h3>
                <p>1</p> 
            </div>
            <div class="card">
                <h3>Plano Ativo</h3>
                <p>Grátis</p> 
            </div>
            <div class="card">
                <h3>Pontuação Global</h3>
                <p>0 pts</p> 
            </div>
        </div>
    </div>
</body>
</html>
