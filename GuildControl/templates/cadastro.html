<!DOCTYPE html>
<html lang="pt-BR">

<heard>

<meta charset="UTF-8">

<title>cadastro</title>

<style>

body{
    background:#0d0018;
    color:white;
    font-family:Arial;
    margin:0;
}

.container{
    padding:30;
}

.card{
    background:#1b0030;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    background:#9d00ff;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;

}

h1{
    color:#c78cff;
}

</style>

</heard>

<body>

<div class="container">
<h1>Criar Conta</h1>
<div class="card">
<div class="card">
        <h2>Cadastro</h2>
        
        <form method="POST" action="/">
            <input type="text" name="nome" placeholder="Nome" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            <input type="email" name="email" placeholder="Email" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            <input type="password" name="senha" placeholder="Senha" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            
            <button type="submit" style="width: 100%; padding: 12px; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;">
                Criar Conta
            </button>
        </form>
    </div>
</div>
</body>
</html>
