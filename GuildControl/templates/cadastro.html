<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildControl - Criar Conta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b111e; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
        .card { width: 100%; max-width: 400px; background-color: #182235; border: 1px solid #26354e; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { font-size: 24px; margin-bottom: 25px; color: #ffffff; font-weight: 600; }
        input { width: 100%; background-color: #1f2b42; border: 1px solid #334464; border-radius: 8px; padding: 12px; color: #ffffff; font-size: 14px; outline: none; margin-bottom: 15px; transition: 0.3s; }
        input:focus { border-color: #a855f7; }
        input::placeholder { color: #64748b; }
        .btn-submit { width: 100%; background-color: #9333ea; color: #ffffff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(147,51,234,0.3); }
        .btn-submit:hover { background-color: #a855f7; }
        .link-footer { margin-top: 20px; display: block; color: #a855f7; text-decoration: none; font-size: 14px; font-weight: 500; }
        .link-footer:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Conta</h2>
        <form method="POST" action="/">
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="email" name="email" placeholder="Seu E-mail" required>
            <input type="password" name="senha" placeholder="Sua Senha" required>
            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>
        <a href="/login" class="link-footer">Já tem uma conta? Faça Login</a>
    </div>
</body>
</html>
