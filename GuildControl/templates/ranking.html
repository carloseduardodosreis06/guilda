<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildControl - Ranking Geral</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; flex-direction: row; background-color: #0b111e; color: #ffffff; min-height: 100vh; }
        
        .sidebar { width: 280px; background-color: #111a2e; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #1f2d4a; flex-shrink: 0; }
        .sidebar h2 { font-size: 22px; color: #a855f7; margin-bottom: 25px; text-align: center; font-weight: bold; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 15px; border-radius: 6px; font-weight: 500; display: block; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background-color: #a855f7; color: #ffffff; font-weight: bold; }
        .sidebar .logout { margin-top: auto; background-color: #ea580c; color: white; text-align: center; }

        .main-content { flex: 1; padding: 30px; background-color: #0d0f1d; }
        .header { margin-bottom: 25px; border-bottom: 1px solid #1f2d4a; padding-bottom: 15px; }
        .header h1 { font-size: 26px; }
        .header span { color: #a855f7; }

        /* Container que permite rolagem da tabela no mobile */
        .table-responsive { width: 100%; overflow-x: auto; background-color: #182235; border: 1px solid #26354e; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        th, td { padding: 15px 20px; border-bottom: 1px solid #1f2b42; font-size: 15px; }
        th { background-color: #1f2b42; color: #a855f7; font-weight: bold; text-transform: uppercase; font-size: 13px; }
        tr:hover td { background-color: #1f2b42; }
        .position-badge { background-color: #9333ea; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #1f2d4a; flex-direction: row; overflow-x: auto; padding: 15px; gap: 8px; scrollbar-width: none; }
            .sidebar::-webkit-scrollbar { display: none; }
            .sidebar h2 { display: none; }
            .sidebar a { padding: 10px 14px; font-size: 14px; }
            .sidebar .logout { margin-top: 0; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚔️ GuildControl</h2>
        <a href="/dashboard">Painel Inicial</a>
        <a href="/guilda">Minha Guilda</a>
        <a href="/ranking" class="active">Ranking Geral</a>
        <a href="/pagamentos">Pagamentos / PIX</a>
        <a href="/perfil">Meu Perfil</a>
        <a href="/auth/logout" class="logout">Sair</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Ranking Geral da <span>Guilda</span></h1>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Nome do Jogador</th>
                        <th>Honra</th>
                        <th>Guerra</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="position-badge">#1</span></td>
                        <td>Junio</td>
                        <td style="color: #38bdf8; font-weight: bold;">0</td>
                        <td style="color: #f97316; font-weight: bold;">0</td>
                        <td style="color: #eab308; font-weight: bold;">0 pts</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
