<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuildControl - Membros</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #0b1426; color: #ffffff; min-height: 100vh; }
        
        /* Menu Lateral */
        .sidebar { width: 260px; background-color: #111e38; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #1f355e; }
        .sidebar h2 { font-size: 20px; color: #00bcd4; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 15px; border-radius: 6px; font-weight: 500; transition: 0.3s; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #00bcd4; color: #0b1426; font-weight: bold; }
        .sidebar .logout { margin-top: auto; background-color: #ea580c; color: white; text-align: center; }
        .sidebar .logout:hover { background-color: #dc2626; color: white; }

        /* Conteúdo Principal */
        .main-content { flex: 1; padding: 40px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1f355e; padding-bottom: 15px; }
        .header-actions h1 { font-size: 28px; }
        
        /* Botão Adicionar Membro */
        .btn-add { background-color: #00bcd4; color: #0b1426; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3); }
        .btn-add:hover { background-color: #0097a7; transform: translateY(-2px); }

        /* Tabela de Membros */
        .table-container { background-color: #111e38; border: 1px solid #1f355e; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 20px; border-bottom: 1px solid #1f355e; }
        th { background-color: #162647; color: #00bcd4; font-weight: bold; text-transform: uppercase; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #162647; }
        
        .badge { background-color: #1e293b; color: #00bcd4; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div class="sidebar">
        <h2>⚔️ GuildControl</h2>
        <a href="/dashboard">Início / Painel</a>
        <a href="/membros" class="active">Gerenciar Membros</a>
        <a href="/planos">Planos da Guilda</a>
        <a href="/pontuacoes">Pontuações</a>
        <a href="/servicos">Serviços</a>
        <a href="/auth/logout" class="logout">Sair da Conta</a>
    </div>

    <!-- Conteúdo da Página -->
    <div class="main-content">
        <div class="header-actions">
            <h1>Membros da Guilda</h1>
            <!-- O BOTÃO DE ADICIONAR QUE ESTAVA FALTANDO FICOU AQUI: -->
            <a href="/adicionar_membro" class="btn-add">+ Adicionar Membro</a>
        </div>

        <!-- Tabela Listando as Pessoas -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome do Jogador</th>
                        <th>E-mail</th>
                        <th>Plano Atual</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Exemplo de membro na lista -->
                    <tr>
                        <td>Augusto Administrador</td>
                        <td>augusto@email.com</td>
                        <td><span class="badge">Slime</span></td>
                        <td style="color: #22c55e; font-weight: bold;">Ativo</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
